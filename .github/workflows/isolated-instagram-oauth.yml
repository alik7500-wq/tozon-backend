name: Isolated Instagram OAuth tests
on:
  pull_request:
    paths:
      - 'src/modules/integrations/**'
      - 'src/tests/instagram-oauth-rollout.test.js'
      - 'src/tests/facebook-business-instagram-oauth.test.js'
      - 'src/tests/social-oauth-state.test.js'
      - '.github/workflows/isolated-instagram-oauth.yml'
  push:
    branches:
      - feature/instagram-oauth-isolated-release
jobs:
  oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run --fileParallelism=false src/tests/instagram-oauth-rollout.test.js src/tests/facebook-business-instagram-oauth.test.js src/tests/social-oauth-state.test.js src/tests/instagram-ingest-gated-production.test.js
