name: Resettlement backend checks
on:
  pull_request:
    paths:
      - 'src/modules/resettlement/**'
      - 'src/app.js'
      - '.github/workflows/resettlement-backend.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/modules/resettlement/resettlement.router.js
      - run: node --check src/app.js
      - run: npm ci
      - name: Resettlement API unit tests
        run: npx vitest run src/modules/resettlement/__tests__/resettlement.router.test.js
      - name: Full backend regression suite (diagnostic; requires dedicated test DB and fixtures)
        continue-on-error: true
        run: npm test
