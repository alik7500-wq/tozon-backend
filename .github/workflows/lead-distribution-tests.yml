name: Lead distribution tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/leads/**'
      - 'src/modules/lead-intake/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lead-distribution-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lead distribution tests
        run: npx vitest run src/modules/leads/roundRobin.service.test.js src/modules/lead-intake/intake.assignment.test.js --fileParallelism=false
