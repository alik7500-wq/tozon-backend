name: TOZON Payment Reminder Automated Scheduler

on:
  schedule:
    # 04:00 UTC daily = 09:00 Asia/Dushanbe daily
    - cron: '0 4 * * *'

permissions:
  contents: read

concurrency:
  group: tozon-payment-reminder-cron
  cancel-in-progress: false

jobs:
  trigger-payment-reminder-scheduler:
    name: Trigger TOZON SMS Scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Internal Scheduler Endpoint
        env:
          SMS_SCHEDULER_INTERNAL_TOKEN: ${{ secrets.SMS_SCHEDULER_INTERNAL_TOKEN }}
        run: |
          if [ -z "$SMS_SCHEDULER_INTERNAL_TOKEN" ]; then
            echo "::error::SMS_SCHEDULER_INTERNAL_TOKEN secret is not configured in GitHub repository secrets"
            exit 1
          fi

          echo "Triggering TOZON CRM internal SMS scheduler endpoint..."

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            --max-time 180 \
            -X POST "https://tozon-backend.onrender.com/api/internal/sms/payment-reminder/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SMS_SCHEDULER_INTERNAL_TOKEN")

          echo "HTTP Response Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Scheduler triggered successfully."
            sed -E 's/"phone":"[^"]*"/"phone":"[REDACTED]"/g' response.json || true
          else
            echo "::error::Scheduler endpoint returned non-2xx status code: $HTTP_STATUS"
            sed -E 's/"phone":"[^"]*"/"phone":"[REDACTED]"/g' response.json || true
            exit 1
          fi
