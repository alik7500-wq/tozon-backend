name: Instagram SQL isolation checks
on:
  pull_request:
    paths:
      - 'docs/instagram-conversation-assignments-proposal.sql'
      - 'src/tests/sql/instagram-assignments-smoke.sql'
      - '.github/workflows/instagram-sql-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: instagram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate tenant constraints and RLS on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d instagram_test -v ON_ERROR_STOP=1 -f src/tests/sql/instagram-assignments-smoke.sql
