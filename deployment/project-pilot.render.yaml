services:
  - type: web
    name: tozon-crm-commercial-test-api
    runtime: node
    repo: https://github.com/alik7500-wq/tozon-backend
    branch: feature/company-projects-foundation
    region: frankfurt
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --omit=dev
    startCommand: npm run pilot:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROJECT_WORKSPACE_PILOT_CONFIRM
        value: yaolkwbnhnacxxjpgiyu
      - key: SUPABASE_URL
        value: https://yaolkwbnhnacxxjpgiyu.supabase.co
      - key: FRONTEND_ORIGIN
        value: https://tozon-crm-commercial-test.onrender.com
      - key: COMPANY_PROJECTS_ENABLED
        value: "true"
      - key: PROJECT_WORKSPACE_ENABLED
        value: "true"
      - key: PROJECT_WORKSPACE_WRITES_ENABLED
        value: "true"
      - key: PROJECT_WORKSPACE_DOCUMENTS_ENABLED
        value: "true"
      - key: PROJECT_WORKSPACE_FILES_ENABLED
        value: "true"
      - key: PROJECT_INTERNAL_REMINDERS_ENABLED
        value: "true"
      - key: SMS_PAYMENT_REMINDER_AUTO_ENABLED
        value: "false"
      - key: SMS_PAYMENT_REMINDER_DETECTOR_ENABLED
        value: "false"
  - type: web
    name: tozon-crm-commercial-test
    runtime: static
    repo: https://github.com/alik7500-wq/tozon-crm
    branch: feature/company-projects-foundation
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tozon-crm-commercial-test-api.onrender.com
      - key: VITE_COMPANY_PROJECTS_ENABLED
        value: "true"
      - key: VITE_PROJECT_INTERNAL_REMINDERS_ENABLED
        value: "true"
      - key: VITE_PROJECT_WORKSPACE_PILOT
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
